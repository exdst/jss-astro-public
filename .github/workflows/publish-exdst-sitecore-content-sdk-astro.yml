name: Publish @exdst-sitecore-content-sdk/astro to NPM
on:
  release:
    types: [created]
permissions:
  id-token: write  # Required for OIDC
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish package on NPM 📦
        working-directory: ./astro-content-sdk/packages/astro-content-sdk
        run: npm publish --provenance --access public